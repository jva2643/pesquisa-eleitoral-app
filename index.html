<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesquisa de Campo</title>

<style>
body {
  font-family: Arial;
  padding: 15px;
  background: #f5f5f5;
}

.container {
  max-width: 600px;
  margin: auto;
  background: #fff;
  padding: 20px;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  background: #007bff;
  color: white;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="container">
  <h2>Pesquisa de Campo</h2>

  <div id="formulario"></div>

  <button onclick="enviarDados()">📤 Enviar Pesquisa</button>
</div>

<script>

const ID_PESQUISA = 1;

// 🔴 COLE SEU LINK AQUI
const URL = "https://script.google.com/macros/s/AKfycbzmLbYngAImyOZ4GB3foo0QFVb5NW4JpY2QkTBdqPT-UhiOlJVX44ItjTdzFD2nAT44/exec";

function carregarPerguntas() {
  const script = document.createElement("script");

  script.src = URL + "?id=" + ID_PESQUISA + "&callback=montarFormulario";

  document.head.appendChild(script);

function montarFormulario(perguntas) {
  const form = document.getElementById("formulario");
  form.innerHTML = "";

  perguntas.forEach(p => {
    const label = document.createElement("label");
    label.innerText = p.pergunta;

    let input;

    if (p.tipo === "texto") {
      input = document.createElement("input");
      input.type = "text";
    }

    if (p.tipo === "numero") {
      input = document.createElement("input");
      input.type = "number";
    }

    if (p.tipo === "select") {
      input = document.createElement("select");

      const opcoes = p.opcoes.split(",");
      opcoes.forEach(op => {
        const option = document.createElement("option");
        option.text = op;
        input.add(option);
      });
    }

    input.id = p.id + "|" + p.pergunta + "|" + p.grupo;

    form.appendChild(label);
    form.appendChild(input);
  });
}

function enviarDados() {
  const inputs = document.querySelectorAll("#formulario input, #formulario select");

  const formData = new FormData();
  formData.append("id_pesquisa", ID_PESQUISA);

  inputs.forEach(input => {
    formData.append(input.id, input.value);
  });

  fetch(URL, {
    method: "POST",
    mode: "no-cors",
    body: formData
  })
  .then(() => {
    alert("Pesquisa enviada com sucesso!");
    location.reload();
  });
}

carregarPerguntas();

</script>

</body>
</html>
